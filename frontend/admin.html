<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- ！viewport-fit=cover 是给刘海屏用的：不写它，CSS 里的 env(safe-area-inset-*)
     永远返回 0，mobile.css 里那一整节安全区适配会静默失效（不报错，只是没生效）。 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mcfr · 管理后台</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%2386c168'/><stop offset='.52' stop-color='%236ba84f'/><stop offset='1' stop-color='%234d7f38'/></linearGradient></defs><rect x='3' y='3' width='26' height='26' rx='4' fill='url(%23g)'/><rect x='10' y='11' width='4' height='4' fill='%231e2328'/><rect x='22' y='19' width='4' height='4' fill='%23c62828'/></svg>">
<!-- ！资源路径一律用【绝对路径】（以 / 开头）。
     帖子详情 /posts/2 是两段路径，相对路径会被解析成 /posts/js/app.js，
     整页 404 白屏。单段路由（/me、/discover）拼出来恰好是对的，
     所以这个坑只在深层路由上才露出来 —— 改回相对路径前请先想清楚这件事。 -->
<link rel="stylesheet" href="/css/aether.css?v=0.39.0">
<link rel="stylesheet" href="/css/app.css?v=0.39.0">
<link rel="stylesheet" href="/css/admin.css?v=0.39.0">
<link rel="stylesheet" href="/css/minecraft.css?v=0.39.0">
<!-- ！必须排在最后：mobile.css 整份都是覆盖层，排在前面会被上面的原值盖掉，
     而且不会报错，只会出现「改了但没效果」。 -->
<link rel="stylesheet" href="/css/mobile.css?v=0.39.0">

<!-- 移动端地址栏 / 状态栏的配色，由 js/theme.js 在切主题时改写 -->
<meta name="theme-color" content="#eef1ee">

<!-- 主题防闪烁，理由同 index.html：必须在样式生效之前定下 data-theme。 -->
<script src="/js/theme-boot.js?v=0.39.0"></script>
</head>
<body>

<canvas id="ion-canvas" aria-hidden="true"></canvas>

<!-- ===================== 管理入口（需要密码） ===================== -->
<section id="admin-gate" class="admin-gate">
  <!-- 登录前也要能切主题。position: fixed 会脱离文档流，
       所以它不会占掉 .admin-gate 网格的一格。 -->
  <button class="theme-toggle theme-toggle--float" data-theme-toggle type="button"></button>

  <div class="panel admin-gate-card edge">
    <span class="orb"></span>

    <span class="eyebrow eyebrow--iris">Admin</span>
    <h1 class="display display-md">管理后台</h1>
    <p class="hint">
      这里需要管理员凭证才能进入。普通用户请回到 <a href="/">mcfr 首页</a>。
    </p>

    <div class="iris-rule iris-rule--fade"></div>

    <!-- v0.32：两种进门方式。
         密钥文件是主推的那条 —— 私钥始终留在你自己电脑上，服务器只存公钥，
         就算数据库被人整个拖走，也没人能拿它进后台。
         密码这条路留着，是因为第一次总得先有办法进门，才能生成第一把密钥。 -->
    <div class="admin-login-modes" id="admin-login-modes">
      <button class="btn btn-sm btn-primary" type="button" data-login-mode="key">
        用密钥文件
      </button>
      <button class="btn btn-sm btn-ghost" type="button" data-login-mode="password">
        用密码
      </button>
    </div>

    <form id="admin-key-form" class="stack hidden">
      <label class="field">
        <span>密钥文件</span>
        <input class="input" type="file" name="key_file"
               accept=".mcfrkey,.key,.pem,application/x-pem-file">
      </label>
      <p class="hint">
        选中密钥文件后点下面的按钮就行，不需要记任何东西。
        签名是在你自己的电脑上算的，私钥不会被发到服务器。
      </p>
      <p class="error-text hidden" id="admin-key-error"></p>
      <button class="btn btn-primary btn-block" type="submit" id="admin-key-submit">
        用密钥进入后台
      </button>
      <p class="hint">
        还没做过密钥？先用密码进来，到「登录密钥」里生成一把。
      </p>
    </form>

    <form id="admin-login-form" class="stack hidden">
      <label class="field">
        <span>管理员用户名</span>
        <input class="input" name="username" required autocomplete="username"
               placeholder="请输入用户名" spellcheck="false">
      </label>
      <label class="field">
        <span>密码</span>
        <input class="input" name="password" type="password" required
               autocomplete="current-password" placeholder="区分大小写">
      </label>
      <div class="field">
        <span>人机验证</span>
        <div class="captcha-row">
          <img class="captcha-img" id="captcha-admin" data-purpose="admin"
               role="button" tabindex="0" title="点一下换一张"
               alt="人机验证图片，点一下换一张">
          <input class="input captcha-input" name="captcha_answer" required
                 minlength="4" maxlength="4" autocomplete="off"
                 autocapitalize="characters" spellcheck="false"
                 placeholder="填图中的 4 个字符">
        </div>
      </div>
      <p class="error-text hidden" id="admin-login-error"></p>
      <button class="btn btn-primary btn-block" type="submit">进入后台</button>
    </form>
  </div>
</section>

<!-- ===================== 后台主体 ===================== -->
<div id="admin-app" class="hidden">
  <header class="topbar">
    <div class="topbar-brand">
      <span class="brand-cube"></span>
      <span class="name">mcfr</span>
      <span class="sub">管理后台</span>
    </div>
    <div class="spacer"></div>
    <button class="theme-toggle" data-theme-toggle type="button"></button>
    <span class="admin-who" id="admin-who"></span>
    <button class="btn btn-ghost btn-sm" data-admin-action="change-password">修改密码</button>
    <button class="btn btn-ghost btn-sm" data-admin-action="refresh">刷新</button>
    <button class="btn btn-ghost btn-sm" data-admin-action="logout">退出后台</button>
  </header>

  <div class="admin-shell">
    <div class="admin-head">
      <div class="stack-sm">
        <span class="eyebrow eyebrow--iris">Dashboard</span>
        <h1 class="display display-lg">运营<span class="iris-text">概览</span></h1>
      </div>
      <span class="hint" id="admin-updated"></span>
    </div>

    <!-- 页签由 admin.js 根据当前账号的权限渲染，不要写死在这里 -->
    <div class="admin-tabs" id="admin-tabs"></div>

    <main id="admin-view"></main>
  </div>
</div>

<div id="overlay-root"></div>
<div class="toast-host" id="toast-host"></div>

<script src="/js/theme.js?v=0.39.0"></script>
<script src="/js/effects.js?v=0.39.0"></script>
<!-- 后台也要用它渲染「看全文」弹窗，不然看到的会是原始 JSON -->
<script src="/js/richtext.js?v=0.39.0"></script>
<script src="/js/admin.js?v=0.39.0"></script>
</body>
</html>
